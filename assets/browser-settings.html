<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'none'"><title>Settings - RETWEAKS Browser</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#101113;color:#eee;font:14px 'Segoe UI',sans-serif}header{position:sticky;top:0;background:#191a1d;padding:20px 30px;display:flex;gap:40px;align-items:center;z-index:2;border-bottom:1px solid #333}header b{font-size:21px}input,select,button{font:inherit;background:#25262a;color:#eee;border:1px solid #45464b;border-radius:20px;padding:10px 14px}#search{width:min(600px,55vw)}nav{position:fixed;width:230px;padding:24px 12px;height:calc(100vh - 80px);overflow:auto}nav a{display:block;padding:13px 18px;color:#bbb;text-decoration:none;border-radius:24px}nav a:hover,nav a:focus{background:#292a2f;color:white}main{margin:28px 32px 100px 260px;max-width:850px}section{scroll-margin-top:100px;margin-bottom:30px}h2{font-size:19px;font-weight:500}.card{background:#1c1d20;border:1px solid #303136;border-radius:18px;overflow:hidden}.row{display:flex;align-items:center;justify-content:space-between;gap:22px;padding:18px 22px;border-bottom:1px solid #303136}.row:last-child{border:0}.row label{line-height:1.6}.row input[type=checkbox]{width:20px;height:20px;accent-color:#ddd;flex-shrink:0}.row input[type=text],.row input[type=url]{width:48%;border-radius:10px}button{cursor:pointer}button:hover{background:#36373c}footer{position:fixed;bottom:0;left:230px;right:0;padding:16px 30px;background:#17181b;border-top:1px solid #333;display:flex;gap:16px;align-items:center}#message{color:#bcd6bc}.note{color:#aaa;line-height:1.7} :focus-visible{outline:2px solid white;outline-offset:3px}@media(max-width:760px){nav{display:none}main{margin:24px 16px 100px}footer{left:0}.row{padding:16px;gap:10px}}
</style><header><b>RETWEAKS Browser / Settings</b><input id="search" placeholder="Search settings" aria-label="Search settings"></header><nav></nav><main><p class="note">Customize the RETWEAKS browser. Changes apply when you select Save changes. Bookmarks, history, the search engine and download choices are shared with RETWEAKS. Website data and permissions are managed by Microsoft Edge WebView2.</p><div id="sections"></div></main><footer><button id="save">Save changes</button><span id="message" role="status"></span></footer><script>
const schema={"Appearance": [["theme", "Website color theme", ["Dark", "Light", "System"]], ["showHome", "Show Home button", true], ["showSave", "Show save shortcut button", true], ["showStatus", "Show status bar", true], ["showLogo", "Show new tab logo", true], ["showGreeting", "Show new tab greeting", true], ["showShortcuts", "Show new tab shortcuts", true], ["compactTiles", "Compact shortcut spacing", true], ["fontSize", "New tab text size", [12, 14, 16, 18, 20, 24]]], "Search engine": [], "On startup": [["startupUrl", "Startup website (blank opens New tab)", "url"], ["homeUrl", "Home button website (blank opens New tab)", "url"]], "Privacy and security": [["autofill", "Allow address and form autofill", true], ["passwords", "Allow WebView2 password saving", true]], "Site settings": [["scripts", "Allow JavaScript on websites (reload pages to apply)", true], ["permissions", "Camera, microphone, location and other permission requests", ["Ask", "Block"]], ["popups", "Allow websites to open new tabs", true], ["contextMenus", "Show right-click menus", true], ["muteNewTabs", "Start new tabs muted", true]], "Downloads": [["downloadPrompt", "Ask where to save each download", true], ["downloadFolder", "Download folder (existing absolute folder path; used when asking is off)", "text"]], "Accessibility": [["pinchZoom", "Allow pinch to zoom", true], ["swipe", "Allow swipe back and forward", true], ["browserKeys", "Enable built-in browser keyboard shortcuts", true]], "Developer tools": [["devTools", "Allow developer tools", true]], "Clear browsing data": [], "About": [], "Reset settings": []};let current;
for(const [name,items] of Object.entries(schema)){const id=name.toLowerCase().replaceAll(' ','-');const link=document.createElement('a');link.href='#'+id;link.textContent=name;document.querySelector('nav').append(link);const section=document.createElement('section');section.id=id;const h=document.createElement('h2');h.textContent=name;const card=document.createElement('div');card.className='card';section.append(h,card);document.querySelector('#sections').append(section);
for(const [key,label,type] of items){const row=document.createElement('div');row.className='row';const l=document.createElement('label');l.htmlFor=key;l.textContent=label;let input;if(Array.isArray(type)){input=document.createElement('select');for(const value of type){const option=document.createElement('option');option.value=value;option.textContent=value;input.append(option)}}else{input=document.createElement('input');input.type=type===true?'checkbox':type;input.maxLength=2048}input.id=key;input.dataset.option=key;row.append(l,input);card.append(row)}
if(name==='Search engine')card.innerHTML='<div class="row"><label for="engine">Address bar search engine</label><select id="engine"></select></div><div class="row"><label for="customSearch">Custom search address (https://… with {q} where the words go; adds "Custom")</label><input id="customSearch" type="text" maxlength="2048" placeholder="https://example.com/search?q={q}"></div>';
if(name==='Appearance')card.insertAdjacentHTML('beforeend','<div class="row"><label for="zoom">Default page zoom</label><select id="zoom">'+[50,67,75,80,90,100,110,125,150,175,200].map(x=>'<option value="'+x/100+'">'+x+'%</option>').join('')+'</select></div>');
if(name==='Clear browsing data')card.innerHTML='<div class="row"><span>Delete cookies, cached files and other site data. You will be signed out of websites. Bookmarks and history are kept.</span><button id="clearData">Clear site data</button></div>';
if(name==='About')card.innerHTML='<div class="row"><span>RETWEAKS Browser. Pages are shown by Microsoft Edge WebView2 <b id="version"></b>.</span></div>';
if(name==='Reset settings')card.innerHTML='<div class="row"><span>Restore browser preferences. Your shortcuts and website data are kept.</span><button id="reset">Restore defaults</button></div>';
}
window.renderSettings=data=>{current=data;for(const input of document.querySelectorAll('[data-option]')){const value=data.options[input.dataset.option];if(input.type==='checkbox')input.checked=value;else input.value=value}const engineSelect=document.querySelector('#engine');engineSelect.replaceChildren();for(const name of (data.engines||['Google','Bing','DuckDuckGo']))engineSelect.add(new Option(name,name));engineSelect.value=data.engine;document.querySelector('#customSearch').value=data.customSearch||'';document.querySelector('#version').textContent=data.version||'';const z=document.querySelector('#zoom');if(!Array.from(z.options).some(o=>Number(o.value)===data.zoom)){z.add(new Option(Math.round(data.zoom*100)+'%',data.zoom))}z.value=data.zoom;document.querySelector('#message').textContent='Preferences loaded';};
document.querySelector('#save').onclick=()=>{if(!current)return;for(const input of document.querySelectorAll('input[type=url]'))if(input.value&&!/^https?:\/\//i.test(input.value)){document.querySelector('#message').textContent='Use an http:// or https:// website address.';input.focus();return}const options={};for(const input of document.querySelectorAll('[data-option]'))options[input.dataset.option]=input.type==='checkbox'?input.checked:input.value;window.chrome.webview.postMessage({op:'save-settings',engine:document.querySelector('#engine').value,customSearch:document.querySelector('#customSearch').value,zoom:Number(document.querySelector('#zoom').value),options});document.querySelector('#message').textContent='Saving...';};
document.querySelector('#clearData').onclick=()=>window.chrome.webview.postMessage({op:'clear-site-data'});
document.querySelector('#reset').onclick=()=>{if(confirm('Restore browser preferences to defaults?'))window.chrome.webview.postMessage({op:'reset-settings'})};
document.querySelector('#search').oninput=e=>{const q=e.target.value.toLowerCase();for(const section of document.querySelectorAll('section')){let found=false;for(const row of section.querySelectorAll('.row')){row.hidden=!row.textContent.toLowerCase().includes(q);row.style.display=row.hidden?'none':'flex';found ||= !row.hidden}section.hidden=!found}};
document.addEventListener('input',e=>{if(e.target.id!=='search')document.querySelector('#message').textContent='Unsaved changes'});
</script></html>
