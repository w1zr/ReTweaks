# Builds RYTWEAKS.exe on a Windows server (CLAUDE.md section 16).
#
# - Pull requests / main / manual run: builds the .exe and attaches it to the run as a
#   downloadable "artifact" (Actions tab -> the run -> Artifacts), for previewing.
# - Pushing a tag like v1.2: builds the .exe and publishes the GitHub release, using
#   release-notes/<tag>.md as the release text.
# - Manual run (Actions tab -> Build RYTWEAKS -> Run workflow) with "release_tag" filled in,
#   e.g. v1.3: builds from main, creates that tag and publishes the release the same way.
#   Leave it empty to only build a preview .exe.
name: Build RYTWEAKS

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Version to release, e.g. v1.3 (leave empty to only build a preview)"
        required: false
        default: ""

permissions:
  contents: write   # needed to create the release on tag pushes

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests -q

      - name: Display functions work on real Windows (names, native size, modes)
        continue-on-error: true      # a runner has no real monitor; reported, not blocking
        run: python tools/display_smoke.py

      - name: Browser engine loads (Edge WebView2 + .NET bridge)
        run: python tools/browser_smoke.py --load-only

      - name: Browser opens a real tab (normal + private)
        continue-on-error: true      # needs a desktop session; reported, not blocking
        run: python tools/browser_smoke.py

      - name: Build RYTWEAKS.exe
        run: python build.py

      - name: SHA-256 checksum (used by the in-app updater to verify downloads)
        shell: pwsh
        run: |
          $h = (Get-FileHash dist/RYTWEAKS.exe -Algorithm SHA256).Hash.ToLower()
          "$h  RYTWEAKS.exe" | Out-File -Encoding ascii dist/RYTWEAKS.exe.sha256
          Get-Content dist/RYTWEAKS.exe.sha256

      - name: Zip copy (for people who prefer downloading a .zip)
        shell: pwsh
        run: Compress-Archive -Path dist/RYTWEAKS.exe -DestinationPath dist/RYTWEAKS.zip -Force

      - name: Upload .exe for preview
        uses: actions/upload-artifact@v4
        with:
          name: RYTWEAKS-exe
          path: |
            dist/RYTWEAKS.exe
            dist/RYTWEAKS.exe.sha256

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag }}
        run: |
          $tag = $env:TAG
          if ($tag -notmatch '^v\d+(\.\d+)*$') { throw "Release tag must look like v1.3 (got '$tag')." }
          $notes = "release-notes/$tag.md"
          if (-not (Test-Path $notes)) { throw "Missing $notes - add release notes before releasing." }
          # Re-releasing the same version (owner's choice, e.g. a fix right after publishing): remove the
          # old release and its tag first, so the tag and files come from the commit just built.
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { gh release delete $tag --cleanup-tag --yes }
          $global:LASTEXITCODE = 0
          # --target creates the tag on the exact commit that was just built
          gh release create $tag dist/RYTWEAKS.exe dist/RYTWEAKS.zip dist/RYTWEAKS.exe.sha256 --target "${{ github.sha }}" --title "RYTWEAKS $tag" --notes-file $notes --latest
